name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    env:
      APP_NAME: BlueSapphire
      APP_PUBLISHER: BlueSapphire Team
      APP_ID: "{{8D43FBFA-A424-4FED-BDE6-6C586D7D13EE}"
      PUBLISH_DIR: ${{ runner.temp }}\BlueSapphire\publish
      INSTALLER_DIR: ${{ runner.temp }}\BlueSapphire\installer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawVersion = "${{ github.event.inputs.version }}".Trim()
          }
          else {
            $rawVersion = "${{ github.ref_name }}".Trim()
          }

          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            throw "Version could not be resolved."
          }

          if ($rawVersion.StartsWith("v")) {
            $version = $rawVersion.Substring(1)
            $tag = $rawVersion
          }
          else {
            $version = $rawVersion
            $tag = "v$rawVersion"
          }

          $installerBaseName = "BlueSapphire_Setup_v$version"

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_BASENAME=$installerBaseName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Publish BlueSapphire
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.PUBLISH_DIR }}" | Out-Null
          dotnet publish BlueSapphire.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:Version=${{ env.VERSION }} `
            -o "${{ env.PUBLISH_DIR }}"

      - name: Resolve ISCC path
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )

          $isccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $isccPath) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          "ISCC_PATH=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.INSTALLER_DIR }}" | Out-Null
          & "${{ env.ISCC_PATH }}" `
            "/dSourcePath=${{ env.PUBLISH_DIR }}" `
            "/dMyAppName=${{ env.APP_NAME }}" `
            "/dMyAppVersion=${{ env.VERSION }}" `
            "/dMyAppPublisher=${{ env.APP_PUBLISHER }}" `
            "/dMyAppId=${{ env.APP_ID }}" `
            "/O${{ env.INSTALLER_DIR }}" `
            "/F${{ env.INSTALLER_BASENAME }}" `
            "installer.iss"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: BlueSapphire ${{ env.RELEASE_TAG }}
          files: ${{ env.INSTALLER_DIR }}\${{ env.INSTALLER_BASENAME }}.exe
          generate_release_notes: true
