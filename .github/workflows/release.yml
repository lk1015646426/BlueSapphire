name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    env:
      APP_NAME: BlueSapphire
      APP_PUBLISHER: BlueSapphire Team
      APP_ID: "{{8D43FBFA-A424-4FED-BDE6-6C586D7D13EE}"
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawVersion = "${{ github.event.inputs.version }}".Trim()
          }
          else {
            $rawVersion = "${{ github.ref_name }}".Trim()
          }

          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
            throw "Version could not be resolved."
          }

          if ($rawVersion.StartsWith("v")) {
            $version = $rawVersion.Substring(1)
            $tag = $rawVersion
          }
          else {
            $version = $rawVersion
            $tag = "v$rawVersion"
          }

          if ($version -notmatch '^(?<core>\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version must use semantic version format, for example 1.2.3 or 1.2.3-preview.1."
          }
          $assemblyVersion = "$($Matches.core).0"
          $installerBaseName = "BlueSapphire_Setup_v$version"

          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASSEMBLY_VERSION=$assemblyVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_BASENAME=$installerBaseName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Restore, build and test
        shell: pwsh
        run: |
          dotnet restore BlueSapphire.Tests\BlueSapphire.Tests.csproj -r win-x64
          dotnet build BlueSapphire.Tests\BlueSapphire.Tests.csproj `
            -c Release `
            -r win-x64 `
            --no-restore `
            -p:TreatWarningsAsErrors=true `
            -p:Version=${{ env.VERSION }} `
            -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} `
            -p:FileVersion=${{ env.ASSEMBLY_VERSION }} `
            -p:InformationalVersion=${{ env.VERSION }}
          dotnet test BlueSapphire.Tests\BlueSapphire.Tests.csproj `
            -c Release `
            -r win-x64 `
            --no-restore `
            --no-build `
            -p:Version=${{ env.VERSION }} `
            -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} `
            -p:FileVersion=${{ env.ASSEMBLY_VERSION }} `
            -p:InformationalVersion=${{ env.VERSION }}

      - name: Publish BlueSapphire
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "BlueSapphire\\publish"
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null
          dotnet publish BlueSapphire.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:WindowsPackageType=None `
            -p:Version=${{ env.VERSION }} `
            -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} `
            -p:FileVersion=${{ env.ASSEMBLY_VERSION }} `
            -p:InformationalVersion=${{ env.VERSION }} `
            -o $publishDir

          $required = @(
            "BlueSapphire.exe",
            "BlueSapphire.dll",
            "Assets\CleanerRules.json",
            "Assets\DevMatrixLog.json",
            "BS.ico"
          )
          foreach ($relativePath in $required) {
            $path = Join-Path $publishDir $relativePath
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Published output is missing: $relativePath"
            }
            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Published output is empty: $relativePath"
            }
          }

      - name: Resolve ISCC path
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )

          $isccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $isccPath) {
            throw "ISCC.exe was not found after installing Inno Setup."
          }

          "ISCC_PATH=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "BlueSapphire\\publish"
          $installerDir = Join-Path $env:RUNNER_TEMP "BlueSapphire\\installer"
          New-Item -ItemType Directory -Force -Path $installerDir | Out-Null
          & "${{ env.ISCC_PATH }}" `
            "/dSourcePath=$publishDir" `
            "/dMySetupIconFile=$((Resolve-Path -LiteralPath 'BS.ico').Path)" `
            "/dMyAppName=${{ env.APP_NAME }}" `
            "/dMyAppVersion=${{ env.VERSION }}" `
            "/dMyAppPublisher=${{ env.APP_PUBLISHER }}" `
            "/dMyAppId=${{ env.APP_ID }}" `
            "/O$installerDir" `
            "/F${{ env.INSTALLER_BASENAME }}" `
            "installer.iss"

      - name: Optionally sign installer
        if: ${{ env.SIGNING_CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $installerPath = Join-Path $env:RUNNER_TEMP "BlueSapphire\installer\${{ env.INSTALLER_BASENAME }}.exe"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe `
            -Recurse `
            -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe was not found."
          }
          & $signtool.FullName sign `
            /fd SHA256 `
            /td SHA256 `
            /tr http://timestamp.digicert.com `
            /f $certificatePath `
            /p $env:SIGNING_CERTIFICATE_PASSWORD `
            $installerPath
          if ($LASTEXITCODE -ne 0) {
            throw "Installer signing failed."
          }
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Create checksum
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP "BlueSapphire\installer\${{ env.INSTALLER_BASENAME }}.exe"
          $checksumPath = "$installerPath.sha256"
          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ env.INSTALLER_BASENAME }}.exe" | Set-Content -LiteralPath $checksumPath -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: BlueSapphire ${{ env.RELEASE_TAG }}
          files: |
            ${{ runner.temp }}\BlueSapphire\installer\${{ env.INSTALLER_BASENAME }}.exe
            ${{ runner.temp }}\BlueSapphire\installer\${{ env.INSTALLER_BASENAME }}.exe.sha256
          overwrite_files: true
          generate_release_notes: true
